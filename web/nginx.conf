# Serves the built React app and forwards API calls to the .NET service,
# so the browser only ever talks to one origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's internal DNS; re-resolve the api service if its container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass $api_upstream;
    }

    # Hashed build assets never change, so browsers can cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which must never be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
