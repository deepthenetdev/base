# Local stack (Starter tier): PostgreSQL + Valkey + the API + the web app + a telemetry dashboard.
#
#   docker compose up --build          # everything, then open http://localhost:3000
#   docker compose up -d postgres valkey aspire-dashboard   # only dependencies, for dotnet run / npm run dev
#
# Values come from .env (copy .env.example). Defaults below are for local development only.
name: base

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-base}
      POSTGRES_USER: ${POSTGRES_USER:-base}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-base_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    # Valkey is the BSD-licensed, Redis-compatible cache (see docs/adr/0003-valkey-for-caching.md).
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  aspire-dashboard:
    # Traces, metrics and logs from the API: http://localhost:18888
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"

  api:
    build:
      context: .
      dockerfile: src/Base.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-base};Username=${POSTGRES_USER:-base};Password=${POSTGRES_PASSWORD:-base_dev_password}
      ConnectionStrings__Valkey: valkey:6379
      Database__ApplyMigrationsOnStartup: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  postgres-data:
